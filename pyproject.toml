[project]
name = "paper_search"
version = "0.4.0"
description = "For comparing ML papers from major ML conferences, Arxiv and Zotero"
authors = [
    {name = "Landcruiser87",email = "andyheroy@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy (>=2.2.4,<3.0.0)",
    "rich (>=13.9.4,<14.0.0)",
    "textual (>=2.1.2,<3.0.0)",
    "pyzotero (>=1.6.11,<2.0.0)",
    "beautifulsoup4 (>=4.13.3,<5.0.0)",
    "lxml (>=5.3.1,<6.0.0)",
    "scikit-learn (>=1.6.1,<2.0.0)",
    "pandas (>=2.2.3,<3.0.0)",
    "wheel (>=0.45.1,<0.46.0)",
    "spacy (>=3.8.5,<4.0.0)",
    "torch (==2.7.0+cu118)",
    "torchaudio (==2.7.0+cu118)",
    "torchvision (==0.22.0+cu118)",
    "sentence-transformers (>=4.1.0,<5.0.0)",
    "textual-dev (>=1.7.0,<2.0.0)",
    "requests (>=2.32.4,<3.0.0)",
    "playwright (>=1.52.0,<2.0.0)",
    "curl-cffi (>=0.13.0,<0.14.0)",
    "textual-serve (>=1.1.2,<2.0.0)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
[[tool.poetry.source]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu118"
priority = "explicit"


[tool.poetry.dependencies]
torch = {source = "pytorch-cuda"}
torchaudio = {source = "pytorch-cuda"}
torchvision = {source = "pytorch-cuda"}

[tool.poetry.scripts]
# command_name = "module.file:function"
paper_search = "paper_search.__main__:main"


[tool.poetry]
packages = [
    { include = "paper_search" }
]
include = [
    "paper_search/css/*.tcss",
    "paper_search/secret/config.json"
]

[project.scripts]
# Users can run either `paper-search` or `paper_search`
paper-search = "paper_search.__main__:main"
paper_search = "paper_search.__main__:main"
paper-search-serve = "paper_search.serve_app:main"
paper-search-sync = "paper_search.scrape_abstracts:cli"